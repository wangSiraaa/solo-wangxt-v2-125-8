services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: plume
      POSTGRES_PASSWORD: plume_demo
      POSTGRES_DB: plume
    ports:
      - "5433:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plume -d plume"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://plume:plume_demo@db:5432/plume
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # 无数据库也可独立运行：删掉 DATABASE_URL 即自动回退内存虚构数据

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
